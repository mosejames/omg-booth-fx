<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMG Booth — Snappic Prompt Catalog</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --card: #1a1a24;
    --border: #2a2a3a;
    --accent: #ff3d6b;
    --accent2: #00d4ff;
    --gold: #ffc94a;
    --text: #e8e8f0;
    --muted: #6b6b85;
    --prompt-bg: #0f0f18;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .header {
    background: linear-gradient(135deg, #0d0d16 0%, #1a0a20 50%, #0a0d1a 100%);
    border-bottom: 1px solid var(--border);
    padding: 40px 48px 32px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }
  .header-inner {
    max-width: 1600px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px;
  }
  .logo {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .logo-eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .logo-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    letter-spacing: 0.04em;
    color: var(--text);
    line-height: 1;
  }
  .logo-title span { color: var(--accent); }

  .header-stats {
    display: flex;
    gap: 32px;
    align-items: center;
  }
  .stat {
    text-align: center;
  }
  .stat-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    color: var(--accent2);
    line-height: 1;
  }
  .stat-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* ── SEARCH + FILTER ── */
  .controls {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 48px;
    position: sticky;
    top: 113px;
    z-index: 99;
  }
  .controls-inner {
    max-width: 1600px;
    margin: 0 auto;
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
  }
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 240px;
  }
  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 14px;
  }
  input[type="search"] {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px 10px 40px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="search"]:focus { border-color: var(--accent2); }
  input[type="search"]::placeholder { color: var(--muted); }

  .filter-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 7px 16px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .filter-btn:hover, .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .filter-btn.active-blue {
    background: var(--accent2);
    border-color: var(--accent2);
    color: #000;
  }

  #result-count {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  /* ── GRID ── */
  .grid-container {
    max-width: 1600px;
    margin: 0 auto;
    padding: 32px 48px 80px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
  }

  /* ── CARD ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
    cursor: pointer;
    position: relative;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: var(--accent2);
    box-shadow: 0 12px 40px rgba(0,212,255,0.12);
  }
  .card.hidden { display: none; }

  .card-img-wrap {
    position: relative;
    aspect-ratio: 1/1;
    overflow: hidden;
    background: var(--surface);
  }
  .card-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s ease;
    display: block;
  }
  .card:hover .card-img-wrap img { transform: scale(1.05); }

  .card-img-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--muted);
    font-size: 32px;
  }
  .card-img-placeholder span {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
  }

  .card-price-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    color: var(--gold);
  }

  .card-category-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    border-radius: 4px;
    padding: 3px 8px;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 500;
  }

  .card-body {
    padding: 16px 18px 14px;
  }
  .card-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 10px;
  }

  /* Prompt area */
  .prompt-toggle {
    background: var(--prompt-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    transition: border-color 0.2s;
  }
  .prompt-toggle:hover { border-color: var(--accent2); }
  .prompt-toggle-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--accent2);
    text-transform: uppercase;
  }
  .prompt-chevron {
    color: var(--muted);
    font-size: 12px;
    transition: transform 0.2s;
  }
  .prompt-toggle.open .prompt-chevron { transform: rotate(180deg); }

  .prompt-content {
    display: none;
    padding: 12px 14px 14px;
    background: var(--prompt-bg);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 8px 8px;
    margin-top: -2px;
  }
  .prompt-content.open { display: block; }
  .prompt-text {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    line-height: 1.7;
    color: #a0a0c0;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .copy-btn {
    margin-top: 10px;
    background: var(--accent);
    border: none;
    border-radius: 6px;
    padding: 8px 18px;
    color: #fff;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    width: 100%;
    text-transform: uppercase;
  }
  .copy-btn:hover { background: #ff1f55; }
  .copy-btn:active { transform: scale(0.98); }
  .copy-btn.copied { background: #00b87a; }

  /* Product link */
  .card-link {
    display: block;
    text-align: center;
    padding: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-decoration: none;
    border-top: 1px solid var(--border);
    transition: color 0.2s, background 0.2s;
    text-transform: uppercase;
  }
  .card-link:hover { color: var(--accent2); background: rgba(0,212,255,0.04); }

  /* Category colors */
  .cat-cartoon  { background: rgba(255,61,107,0.15); color: #ff7096; }
  .cat-neon     { background: rgba(0,212,255,0.12); color: var(--accent2); }
  .cat-editorial{ background: rgba(255,201,74,0.12); color: var(--gold); }
  .cat-sketch   { background: rgba(180,120,255,0.12); color: #c490ff; }
  .cat-holiday  { background: rgba(80,220,120,0.12); color: #50dc78; }
  .cat-cinematic{ background: rgba(255,140,60,0.12); color: #ff8c3c; }
  .cat-bundle   { background: rgba(255,255,255,0.1); color: #fff; }

  /* ── EMPTY STATE ── */
  #empty-state {
    display: none;
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
    grid-column: 1/-1;
  }
  #empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; }
  #empty-state p { font-family: 'DM Mono', monospace; font-size: 13px; }

  /* ── FOOTER ── */
  .footer {
    border-top: 1px solid var(--border);
    padding: 24px 48px;
    text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 32px;
    right: 32px;
    background: #00b87a;
    color: #fff;
    padding: 12px 20px;
    border-radius: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    opacity: 0;
    transform: translateY(12px);
    transition: all 0.3s;
    pointer-events: none;
    z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  @media (max-width: 768px) {
    .header, .controls { padding-left: 20px; padding-right: 20px; }
    .grid-container { padding: 20px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .header-stats { gap: 16px; }
    .controls { top: 97px; }
  }
</style>
</head>

const BASE_IMG = 'https://digitalstudiobyryan.com/cdn/shop/files/';

const CAT_LABELS = {
  cartoon:   ['CARTOON','cat-cartoon'],
  neon:      ['NEON / CYBER','cat-neon'],
  editorial: ['EDITORIAL','cat-editorial'],
  sketch:    ['SKETCH / INK','cat-sketch'],
  holiday:   ['HOLIDAY','cat-holiday'],
  cinematic: ['CINEMATIC','cat-cinematic'],
  bundle:    ['BUNDLE','cat-bundle'],
};

function buildCards() {
  const grid = document.getElementById('grid');
  const emptyState = document.getElementById('empty-state');
  
  PRODUCTS.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.name = p.name.toLowerCase();
    card.dataset.cat = p.cat;
    card.dataset.prompt = p.prompt.toLowerCase();
    
    const imgUrl = BASE_IMG + p.img;
    const [catLabel, catClass] = CAT_LABELS[p.cat] || ['OTHER','cat-editorial'];
    const promptId = 'prompt-' + i;
    
    card.innerHTML = `
      <div class="card-img-wrap">
        <img src="${imgUrl}" alt="${p.name}" loading="lazy" 
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="card-img-placeholder" style="display:none">
          <span>🎨</span><span>Preview</span>
        </div>
        <div class="card-price-badge">${p.price}</div>
        <div class="card-category-badge ${catClass}">${catLabel}</div>
      </div>
      <div class="card-body">
        <div class="card-name">${p.name}</div>
        <div class="prompt-toggle" onclick="togglePrompt(this,'${promptId}')">
          <span class="prompt-toggle-label">Snappic Prompt</span>
          <span class="prompt-chevron">▾</span>
        </div>
        <div class="prompt-content" id="${promptId}">
          <div class="prompt-text">${p.prompt}</div>
          <button class="copy-btn" onclick="copyPrompt(this, \`${p.prompt.replace(/`/g,"'")}\`)">Copy Prompt</button>
        </div>
      </div>
      <a class="card-link" href="https://digitalstudiobyryan.com/products/${p.slug}" target="_blank">View on Site →</a>
    `;
    
    grid.insertBefore(card, emptyState);
  });
}

function togglePrompt(toggle, id) {
  toggle.classList.toggle('open');
  document.getElementById(id).classList.toggle('open');
}

function copyPrompt(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    showToast();
    setTimeout(() => {
      btn.textContent = 'Copy Prompt';
      btn.classList.remove('copied');
    }, 2000);
  });
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

let currentFilter = 'all';
let currentSearch = '';

function applyFilters() {
  const cards = document.querySelectorAll('.card');
  let visible = 0;
  cards.forEach(card => {
    const matchesCat = currentFilter === 'all' || card.dataset.cat === currentFilter;
    const matchesSearch = !currentSearch || 
      card.dataset.name.includes(currentSearch) || 
      card.dataset.prompt.includes(currentSearch);
    if (matchesCat && matchesSearch) {
      card.classList.remove('hidden');
      visible++;
    } else {
      card.classList.add('hidden');
    }
  });
  document.getElementById('result-count').textContent = visible + ' prompt' + (visible !== 1 ? 's' : '');
  document.getElementById('empty-state').style.display = visible === 0 ? 'block' : 'none';
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    applyFilters();
  });
});

document.getElementById('search').addEventListener('input', e => {
  currentSearch = e.target.value.toLowerCase().trim();
  applyFilters();
});

buildCards();
document.getElementById('total-count').textContent = PRODUCTS.length;
</script>
